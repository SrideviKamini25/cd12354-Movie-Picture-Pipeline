name: Backend CD

on:
  push:
    branches:
      - main

jobs:
  backend-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        working-directory: starter/backend
        run: |
          docker build -t 040970479428.dkr.ecr.us-east-1.amazonaws.com/backend:latest .

      - name: Push backend Docker image
        run: |
          docker push 040970479428.dkr.ecr.us-east-1.amazonaws.com/backend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy backend
        run: |
          kubectl apply -f starter/backend/k8s/deployment.yaml
          kubectl apply -f starter/backend/k8s/service.yaml

      - name: Restart backend
        run: |
          kubectl rollout restart deployment/backend

            - name: Verify backend deployment
        run: |
          kubectl rollout status deployment/backend --timeout=120s || true
          
          echo "===== DEPLOYMENT ====="
          kubectl get deployment backend -o wide
          
          echo "===== ALL PODS ====="
          kubectl get pods -o wide
          
          echo "===== BACKEND PODS ====="
          kubectl get pods -l app=backend -o wide
          
          echo "===== DEPLOYMENT DESCRIPTION ====="
          kubectl describe deployment backend
          
          echo "===== BACKEND SERVICE ====="
          kubectl get svc backend
          
          echo "===== RECENT EVENTS ====="
          kubectl get events --sort-by=.lastTimestamp | tail -30