name: Frontend CD

on:
  push:
    branches:
      - main

jobs:
  frontend-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build -t 040970479428.dkr.ecr.us-east-1.amazonaws.com/frontend:latest .

      - name: Push frontend Docker image
        run: |
          docker push 040970479428.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy frontend
        run: |
          kubectl apply -f starter/frontend/k8s/deployment.yaml
          kubectl apply -f starter/frontend/k8s/service.yaml

      - name: Restart frontend
        run: |
          kubectl rollout restart deployment/frontend

      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=120s || true
          echo "===== DEPLOYMENT ====="
          kubectl get deployment frontend -o wide
          echo "===== PODS ====="
          kubectl get pods -l app=frontend -o wide
          echo "===== SERVICE ====="
          kubectl get svc frontend